<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Examen de Desarrollo web en entorno servidor</title>
        <link rel="stylesheet" type="text/css" href="../estilos/estilos.css">
        <link rel="icon" type="image/png" sizes="32x32" href="../imagenes/favicon.jpeg">
    </head>
    <body>
        <h1>Centro de Ayuda al Empleo</h1>
        <h2>Formulario de solicitud</h2>
        <button onclick="location.href='../php/tabla.php?tipo=soldadura'">Soldadura</button>
        <button onclick="location.href='../php/tabla.php?tipo=informatica'">Informática</button>
        <button onclick="location.href='../php/tabla.php?tipo=socio'">Asistencia Sociosanitaria</button>
        <form action="../php/tabla.php" method="POST">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <br><br>

            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos" required>

            <br><br>

            <label for="dni">DNI:</label>
            <input type="text" id="dni" name="dni" required>

            <br><br>

            <label for="f_nac">Fecha de nacimiento:</label>
            <input type="date" id="f_nac" name="f_nac" required>

            <br><br>

            <label for="tlf">Teléfono:</label>
            <input type="tel" id="tlf" name="tlf" required>

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <p>Profesión:</p>

            <label for="soldadura"><input type="radio" id="soldadura" name="profesion" value="soldadura" required style="width: auto; padding: 0; border: 0; background: transparent; vertical-align: middle;"> Soldadura</label>

            <label for="informatica"><input type="radio" id="informatica" name="profesion" value="informatica" style="width: auto; padding: 0; border: 0; background: transparent; vertical-align: middle;"> Informática</label>

            <label for="socio"><input type="radio" id="socio" name="profesion" value="socio" style="width: auto; padding: 0; border: 0; background: transparent; vertical-align: middle;"> Asistencia Sociosanitaria</label>

            <br><br>

            <p>Jornada:</p>

            <label for="parcial"><input type="radio" id="parcial" name="jornadaParcial" value="1" required style="width: auto; padding: 0; border: 0; background: transparent; vertical-align: middle;"> Parcial</label>

            <label for="completa"><input type="radio" id="completa" name="jornadaParcial" value="0" style="width: auto; padding: 0; border: 0; background: transparent; vertical-align: middle;"> Completa</label>

            <br><br>

            <p>Idiomas:</p>

            <label for="euskera"><input type="checkbox" id="euskera" name="idiomas[]" value="Euskera" style="width: auto; padding: 0; border: 0; background: transparent; vertical-align: middle;"> Euskera</label>

            <label for="ingles"><input type="checkbox" id="ingles" name="idiomas[]" value="Inglés" style="width: auto; padding: 0; border: 0; background: transparent; vertical-align: middle;"> Inglés</label>

            <br><br>
            
            <input type="submit" value="Enviar solicitud">
        </form>
    </body>
</html>
